<!doctype html><html><head><meta charset="utf-8"><title>Engine regression fixture</title>
<style>
body{background:#fff;color:#222;font:16px system-ui;margin:0}
.card{background:#f4f4f4;color:#333;padding:6px;border-bottom:1px solid #ccc}
#badge::before{content:'Before';background:#eee;color:#333;border:1px solid #ccc}
#badge::after{content:'After';background:linear-gradient(#fff,#ddd);color:#222}
#badge.no-pseudo::before,#badge.no-pseudo::after{content:none}
:is(.pseudo-a,.pseudo-b)::before{content:'Grouped';background:#fff;color:#111}
.stable{background:#f4f4f4}.moving{transform:translateX(1px);opacity:.99}
.hot{background:#ffe5ad;color:#444}
#transition{transition:color 3s,background-color 3s;background:#eee;color:#222}
#transition.changed{background:#cfe5ff;color:#234}
</style></head><body>
<p id="badge">Pseudo-elements</p><p class="pseudo-b">Functional selector</p>
<div id="transition">Transition target</div>
<div id="cards"></div>
<script>
for(let i=0;i<500;i++){const el=document.createElement('div');el.className='card';el.id='card'+i;el.innerHTML='<span>Card '+i+'</span>';cards.append(el)}
const adopted=new CSSStyleSheet();adopted.replaceSync('#adopted::before{content:"Constructed";background:white;color:black}');document.adoptedStyleSheets=[adopted];const adoptedEl=document.createElement('p');adoptedEl.id='adopted';adoptedEl.textContent='Constructed sheet';document.body.prepend(adoptedEl);
</script></body></html>
