<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <strong>Dusk</strong>
    <span id="host" class="muted"></span>
  </header>

  <section class="row">
    <span>Mode</span>
    <div class="seg" id="modes">
      <button data-mode="auto">Auto</button>
      <button data-mode="on">Always</button>
      <button data-mode="off">Off</button>
    </div>
  </section>

  <section id="state" class="card"></section>

  <section>
    <div class="label">Something look wrong?</div>
    <div class="grid">
      <button data-fb="too_bright">Too bright</button>
      <button data-fb="too_dark">Too dark</button>
      <button data-fb="hard_to_read">Hard to read</button>
      <button data-fb="colors_wrong">Colors off</button>
      <button data-fb="images_wrong">Images off</button>
      <button id="pick">Fix an element…</button>
    </div>
    <div id="result" class="muted small"></div>
  </section>

  <footer>
    <button id="reset" class="link">Forget this site</button>
    <button id="diag" class="link">Copy diagnostics</button>
    <a href="options.html" target="_blank" class="link">Jev settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
